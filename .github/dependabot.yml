version: 2
updates:
  # Site dependencies (Next.js app).
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Roll minor + patch bumps into one PR to cut noise.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The GitHub Actions we pin in workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
